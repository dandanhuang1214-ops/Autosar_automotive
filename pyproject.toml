[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "automotive-workbench"
version = "0.1.0"
description = "Artifact-first automotive software engineering workbench."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
can = ["cantools>=41.4,<42", "python-can>=4.6,<5"]
diag = ["cantools>=41.4,<42", "python-can>=4.6,<5", "can-isotp>=2.0,<3", "udsoncan>=1.26,<2"]
dev = ["jsonschema[format]>=4.26,<5", "mypy>=2.3.1,<3", "ruff>=0.16.6,<1", "setuptools>=68"]

[project.scripts]
workbench = "automotive_workbench.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
