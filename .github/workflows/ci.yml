name: core-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core-contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install CAN and diagnostic adapter dependencies
        run: python -m pip install -e ".[diag,dev]"
      - name: Record resolved dependency inventory
        run: python scripts/write_dependency_inventory.py --output output/dependency-inventory/resolved-${{ runner.os }}-python-3.11.json
      - name: Upload resolved dependency inventory
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependency-inventory-${{ runner.os }}-python-3.11
          path: output/dependency-inventory/
          if-no-files-found: error
      - name: Smoke-test installed wheel distribution
        run: python scripts/check_installed_distribution.py --output output/distribution-smoke
      - name: Upload installed distribution smoke evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: installed-distribution-smoke-${{ runner.os }}-python-3.11
          path: output/distribution-smoke/installed-distribution-smoke.json
          if-no-files-found: error
      - name: Verify evidence capsule with installed wheel
        run: python scripts/check_installed_capsule_consumer.py --output output/installed-capsule-consumer
      - name: Upload installed capsule consumer evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: installed-capsule-consumer-${{ runner.os }}-python-3.11
          path: output/installed-capsule-consumer/installed-capsule-consumer.json
          if-no-files-found: error
      - name: Run core tests
        id: core_tests
        env:
          PYTHONPATH: src
        run: python scripts/run_ci_tests.py --output output/test-results
      - name: Upload core test evidence
        if: ${{ always() && steps.core_tests.outcome != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: core-test-results-${{ runner.os }}
          path: output/test-results/
          if-no-files-found: error
      - name: Smoke-test signal trace
        env:
          PYTHONPATH: src
        run: python -m automotive_workbench.cli trace examples/window_control/bsw_intent.json WindowPosition
      - name: Validate DBC-to-intent mapping
        env:
          PYTHONPATH: src
        run: python -m automotive_workbench.cli validate-map examples/window_control/window_control.dbc examples/window_control/bsw_intent.json
      - name: Validate DBC-to-canonical mapping
        env:
          PYTHONPATH: src
        run: python -m automotive_workbench.cli validate-contract examples/window_control/window_control.dbc examples/window_control/canonical_contract.json examples/window_control/bsw_intent.json
      - name: Run fault-injection experiment suite
        env:
          PYTHONPATH: src
        run: python -m automotive_workbench.cli run-suite examples/window_control/window_control.dbc examples/window_control/canonical_contract.json examples/window_control/bsw_intent.json --output output/ci
      - name: Validate checked-in JSON
        run: python scripts/check_json.py
      - name: Validate CI job topology
        run: python scripts/check_ci_topology.py
      - name: Run project explanation fact scenarios
        run: python scripts/run_project_explanation_scenarios.py --output output/project-explanation/scenarios
      - name: Run model explanation adapter scenarios
        run: python scripts/run_model_explanation_scenarios.py --output output/project-explanation/model-scenarios
      - name: Verify installed project explanation
        run: python scripts/check_installed_explanation.py --output output/project-explanation/installed
      - name: Upload project explanation evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: project-explanation-${{ runner.os }}
          path: output/project-explanation/
          if-no-files-found: error
      - name: Run minimum-error Ruff gate
        run: ruff check src tests scripts
      - name: Run scoped evidence type gate
        run: mypy --ignore-missing-imports scripts/assess_model_explanation.py src/automotive_workbench/model_explanation.py src/automotive_workbench/explanation_services.py scripts/explanation_fixture_service.py scripts/run_model_explanation_scenarios.py src/automotive_workbench/project_explanation.py scripts/run_project_explanation_scenarios.py scripts/check_installed_explanation.py src/automotive_workbench/ecuc_diagnostic.py scripts/run_ecuc_diagnostic_scenarios.py src/automotive_workbench/ecuc_runtime.py scripts/run_ecuc_runtime_scenarios.py src/automotive_workbench/ecuc_policy.py src/automotive_workbench/project_ecuc.py scripts/run_ecuc_acceptance_scenarios.py src/automotive_workbench/ecuc_model.py src/automotive_workbench/ecuc_integration.py src/automotive_workbench/ecuc_review.py src/automotive_workbench/ecuc_impact.py scripts/run_ecuc_engineering_scenarios.py scripts/check_installed_ecuc.py src/automotive_workbench/ecuc_communication.py scripts/run_ecuc_communication_scenarios.py src/automotive_workbench/ecuc_project.py scripts/run_ecuc_project_scenarios.py scripts/check_installed_projects.py src/automotive_workbench/engineering_search.py scripts/run_p24_assessment.py src/automotive_workbench/engineering_review.py scripts/run_engineering_review_scenarios.py src/automotive_workbench/project_external.py scripts/run_external_project_scenarios.py src/automotive_workbench/external_ecu.py scripts/build_openbsw_execution.py scripts/run_external_ecu_scenarios.py src/automotive_workbench/project_arxml.py scripts/run_arxml_project_scenarios.py src/automotive_workbench/arxml_bridge.py scripts/replay_arxml_export.py scripts/run_arxml_scenarios.py src/automotive_workbench/communication_graph.py scripts/run_communication_graph_scenarios.py src/automotive_workbench/project_declared.py scripts/run_multi_project_scenarios.py src/automotive_workbench/declared_communication.py scripts/run_declared_communication_scenarios.py src/automotive_workbench/communication_plan.py src/automotive_workbench/adapters/generation_gate.py scripts/create_public_delivery_docx.py scripts/run_generate_arxml_bridge.py scripts/run_project_review_scenarios.py scripts/run_project_comparison_scenarios.py src/automotive_workbench/project_workflow.py src/automotive_workbench/project_review.py src/automotive_workbench/project_comparison.py src/automotive_workbench/evidence_bundle.py src/automotive_workbench/evidence_capsule.py src/automotive_workbench/evidence_capsule_verification.py scripts/check_json.py scripts/check_installed_distribution.py scripts/check_installed_capsule_consumer.py scripts/write_dependency_inventory.py

  runtime-evidence:
    needs: core-contracts
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install CAN and diagnostic adapter dependencies
        run: python -m pip install -e ".[diag,dev]"
      - name: Run virtual CAN runtime lab
        env:
          PYTHONPATH: src
        run: python -m automotive_workbench.cli run-can-lab examples/window_control/window_control.dbc --output output/ci
      - name: Preflight declared communication scenarios
        run: python scripts/run_communication_preflight_scenarios.py --output output/communication-preflight
      - name: Upload communication preflight evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: communication-preflight-${{ runner.os }}
          path: output/communication-preflight/
          if-no-files-found: error
      - name: Run declared communication scenarios
        run: python scripts/run_declared_communication_scenarios.py --output output/declared-communication
      - name: Upload declared communication evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: declared-communication-${{ runner.os }}
          path: output/declared-communication/
          if-no-files-found: error
      - name: Run complete communication evidence chain
        id: communication_chain
        env:
          PYTHONPATH: src
        run: python -m automotive_workbench.cli run-communication-chain examples/window_control/window_control.dbc examples/window_control/bsw_intent.json --output output/communication-chain
      - name: Run engineering review development scenarios
        run: python scripts/run_engineering_review_scenarios.py --output output/engineering-review
      - name: Assess engineering review components
        run: python scripts/run_p24_assessment.py --development output/engineering-review --output output/p24-assessment --historical-regression tests/fixtures/p24-held-out-0.1.json
      - name: Upload engineering review assessment
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: engineering-review-assessment-${{ runner.os }}
          path: output/p24-assessment/
          if-no-files-found: error
      - name: Upload engineering review development evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: engineering-review-${{ runner.os }}
          path: output/engineering-review/
          if-no-files-found: error
      - name: Run external ECU project scenarios
        run: python scripts/run_external_project_scenarios.py --output output/external-project
      - name: Upload external ECU project evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: external-project-${{ runner.os }}
          path: output/external-project/
          if-no-files-found: error
      - name: Run external ECU offline scenarios
        run: python scripts/run_external_ecu_scenarios.py --output output/external-ecu
      - name: Upload external ECU offline evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: external-ecu-${{ runner.os }}
          path: output/external-ecu/
          if-no-files-found: error
      - name: Run configuration diagnostic link scenarios
        run: python scripts/run_ecuc_diagnostic_scenarios.py --output output/ecuc-diagnostic-links
      - name: Verify installed configuration diagnostic links
        run: python scripts/check_installed_ecuc.py --diagnostic-links --output output/installed-ecuc-diagnostic-links
      - name: Upload configuration diagnostic link evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ecuc-diagnostic-links-${{ runner.os }}
          path: |
            output/ecuc-diagnostic-links/
            output/installed-ecuc-diagnostic-links/
          if-no-files-found: error
      - name: Run configuration runtime link scenarios
        run: python scripts/run_ecuc_runtime_scenarios.py --output output/ecuc-runtime-links
      - name: Verify installed configuration runtime links
        run: python scripts/check_installed_ecuc.py --linked-runtime --output output/installed-ecuc-runtime-links
      - name: Upload configuration runtime link evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ecuc-runtime-links-${{ runner.os }}
          path: |
            output/ecuc-runtime-links/
            output/installed-ecuc-runtime-links/
          if-no-files-found: error
      - name: Run object policy acceptance scenarios
        run: python scripts/run_ecuc_acceptance_scenarios.py --object-policies --output output/ecuc-policies
      - name: Verify installed object policy acceptance
        run: python scripts/check_installed_ecuc.py --object-policies --output output/installed-ecuc-policies
      - name: Upload object policy acceptance evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ecuc-policies-${{ runner.os }}
          path: |
            output/ecuc-policies/
            output/installed-ecuc-policies/
          if-no-files-found: error
      - name: Run declarative ECUC project scenarios
        run: python scripts/run_ecuc_acceptance_scenarios.py --output output/ecuc-projects
      - name: Verify installed ECUC project acceptance
        run: python scripts/check_installed_ecuc.py --project-acceptance --output output/installed-ecuc-projects
      - name: Upload declarative ECUC project evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ecuc-projects-${{ runner.os }}
          path: |
            output/ecuc-projects/
            output/installed-ecuc-projects/
          if-no-files-found: error
      - name: Run ECUC engineering stage scenarios
        run: python scripts/run_ecuc_engineering_scenarios.py --output output/ecuc-engineering
      - name: Verify installed ECUC engineering workflow
        run: python scripts/check_installed_ecuc.py --output output/installed-ecuc
      - name: Upload ECUC engineering stage evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ecuc-engineering-${{ runner.os }}
          path: |
            output/ecuc-engineering/
            output/installed-ecuc/
          if-no-files-found: error
      - name: Run ECUC communication chain scenarios
        run: python scripts/run_ecuc_communication_scenarios.py --output output/ecuc-communication
      - name: Upload ECUC communication chain evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ecuc-communication-${{ runner.os }}
          path: output/ecuc-communication/
          if-no-files-found: error
      - name: Run ECUC project inspection scenarios
        run: python scripts/run_ecuc_project_scenarios.py --output output/ecuc-inspection
      - name: Upload ECUC project inspection evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ecuc-inspection-${{ runner.os }}
          path: output/ecuc-inspection/
          if-no-files-found: error
      - name: Run ARXML project scenarios
        run: python scripts/run_arxml_project_scenarios.py --output output/arxml-project
      - name: Upload ARXML project evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: arxml-project-${{ runner.os }}
          path: output/arxml-project/
          if-no-files-found: error
      - name: Run ARXML bridge scenarios
        env:
          PYTHONPATH: src
        run: python scripts/run_arxml_scenarios.py --output output/arxml-bridge
      - name: Upload ARXML bridge evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: arxml-bridge-${{ runner.os }}
          path: output/arxml-bridge/
          if-no-files-found: error
      - name: Run communication graph scenarios
        run: python scripts/run_communication_graph_scenarios.py --output output/communication-graph
      - name: Upload communication graph evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: communication-graph-${{ runner.os }}
          path: output/communication-graph/
          if-no-files-found: error
      - name: Verify installed multi-project delivery
        run: python scripts/check_installed_projects.py --output output/installed-projects
      - name: Upload installed multi-project delivery
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: installed-projects-${{ runner.os }}
          path: output/installed-projects/
          if-no-files-found: error
      - name: Run multi-project release scenarios
        run: python scripts/run_multi_project_scenarios.py --output output/multi-project-release
      - name: Upload multi-project release evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: multi-project-release-${{ runner.os }}
          path: output/multi-project-release/
          if-no-files-found: error
      - name: Run project acceptance workflow
        id: project_acceptance
        env:
          PYTHONPATH: src
        run: python -m automotive_workbench.cli run-project examples/window_control/project.json --output output/project-acceptance
      - name: Upload project acceptance report
        if: ${{ always() && steps.project_acceptance.outcome != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: project-acceptance-${{ runner.os }}
          path: output/project-acceptance/
          if-no-files-found: error
      - name: Run imported Generate-Arxml project
        id: generated_project
        env:
          PYTHONPATH: src
        run: python -m automotive_workbench.cli run-project examples/generate_arxml/bridge/baseline/project.json --output output/generated-project
      - name: Upload imported Generate-Arxml evidence
        if: ${{ always() && steps.generated_project.outcome != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: generated-project-${{ runner.os }}
          path: output/generated-project/
          if-no-files-found: error
      - name: Run project-level engineering review scenarios
        id: project_review
        env:
          PYTHONPATH: src
        run: python scripts/run_project_review_scenarios.py --output output/project-review
      - name: Upload project-level engineering review evidence
        if: ${{ always() && steps.project_review.outcome != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: project-review-${{ runner.os }}
          path: output/project-review/
          if-no-files-found: error
      - name: Run project comparison scenarios
        id: project_comparison
        env:
          PYTHONPATH: src
        run: python scripts/run_project_comparison_scenarios.py --output output/project-comparison
      - name: Verify saved project comparison
        env:
          PYTHONPATH: src
        run: python -m automotive_workbench.cli verify-project-comparison output/project-comparison/comparisons/scale-regression/project-comparison.json
      - name: Upload project comparison evidence
        if: ${{ always() && steps.project_comparison.outcome != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: project-comparison-${{ runner.os }}
          path: output/project-comparison/
          if-no-files-found: error
      - name: Upload communication chain evidence
        if: ${{ always() && steps.communication_chain.outcome != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: communication-chain-${{ runner.os }}
          path: output/communication-chain/
          if-no-files-found: error
      - name: Run one-command communication evidence delivery
        id: communication_delivery
        env:
          PYTHONPATH: src
        run: python -m automotive_workbench.cli run-communication-delivery examples/window_control/window_control.dbc examples/window_control/bsw_intent.json --base . --output output/communication-delivery
      - name: Upload communication evidence delivery
        if: ${{ always() && steps.communication_delivery.outcome != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: communication-delivery-${{ runner.os }}
          path: output/communication-delivery/
          if-no-files-found: error
      - name: Export self-contained evidence capsule
        id: evidence_capsule
        env:
          PYTHONPATH: src
        run: python -m automotive_workbench.cli export-evidence-capsule output/communication-delivery --base . --output output/evidence-capsule
      - name: Relocate evidence capsule
        run: python -c "import shutil; shutil.copytree('output/evidence-capsule', 'output/evidence-capsule-relocated')"
      - name: Verify relocated evidence capsule offline
        env:
          PYTHONPATH: src
        run: python -m automotive_workbench.cli verify-evidence output/evidence-capsule-relocated/bundle output/evidence-capsule-relocated/manifest.json --base output/evidence-capsule-relocated --output output/evidence-capsule-relocated-recheck
      - name: Verify complete relocated capsule inventory
        env:
          PYTHONPATH: src
        run: python -m automotive_workbench.cli verify-evidence-capsule output/evidence-capsule-relocated --output output/evidence-capsule-verification-normal
      - name: Upload self-contained evidence capsule
        if: ${{ always() && steps.evidence_capsule.outcome != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: evidence-capsule-${{ runner.os }}
          path: |
            output/evidence-capsule/
            output/evidence-capsule-relocated-recheck/
            output/evidence-capsule-verification-normal/
          if-no-files-found: error
      - name: Index communication evidence bundle
        env:
          PYTHONPATH: src
        run: python -m automotive_workbench.cli index-evidence output/communication-chain --producer "workbench run-communication-chain" --base . --manifest output/evidence-manifests/communication-chain.json
      - name: Upload evidence bundle manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: evidence-bundle-manifest-${{ runner.os }}
          path: output/evidence-manifests/communication-chain.json
          if-no-files-found: error
      - name: Verify unchanged evidence bundle
        env:
          PYTHONPATH: src
        run: python -m automotive_workbench.cli verify-evidence output/communication-chain output/evidence-manifests/communication-chain.json --base . --output output/evidence-verification-normal
      - name: Upload normal evidence verification
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: evidence-verification-normal-${{ runner.os }}
          path: output/evidence-verification-normal/
          if-no-files-found: error
      - name: Run periodic communication supervision
        env:
          PYTHONPATH: src
        run: python -m automotive_workbench.cli run-can-supervision examples/window_control/window_control.dbc --output output/ci
      - name: Run capture-decode-replay log lab
        env:
          PYTHONPATH: src
        run: python -m automotive_workbench.cli run-log-lab examples/window_control/window_control.dbc --output output/log-lab
      - name: Probe virtual backend
        env:
          PYTHONPATH: src
        run: python -m automotive_workbench.cli probe-can-backend --interface virtual --channel ci-probe --output output/backend-probe
      - name: Run backend-neutral lab on virtual
        env:
          PYTHONPATH: src
        run: python -m automotive_workbench.cli run-backend-lab examples/window_control/window_control.dbc --interface virtual --channel ci-lab --output output/backend-lab
      - name: Run fixed-report engineering review cohort
        id: fixed_report_review
        env:
          PYTHONPATH: src
        run: python -m automotive_workbench.cli run-review-eval examples/review/evaluation/external-cohort-evaluation.json --output output/review-external-cohort
      - name: Upload fixed-report review evidence
        if: ${{ always() && steps.fixed_report_review.outcome != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: review-external-cohort-${{ runner.os }}
          path: output/review-external-cohort/
          if-no-files-found: error

  controlled-rejections:
    needs: core-contracts
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install CAN and diagnostic adapter dependencies
        run: python -m pip install -e ".[diag,dev]"
      - name: Build communication evidence prerequisite
        env:
          PYTHONPATH: src
        run: python -m automotive_workbench.cli run-communication-chain examples/window_control/window_control.dbc examples/window_control/bsw_intent.json --output output/communication-chain
      - name: Index communication evidence prerequisite
        env:
          PYTHONPATH: src
        run: python -m automotive_workbench.cli index-evidence output/communication-chain --producer "workbench run-communication-chain" --base . --manifest output/evidence-manifests/communication-chain.json
      - name: Prepare controlled evidence tamper
        run: python scripts/evidence_bundle_tamper_exercise.py prepare output/communication-chain output/communication-chain-tampered
      - name: Run controlled evidence tamper rejection
        id: controlled_evidence_tamper
        continue-on-error: true
        env:
          PYTHONPATH: src
        run: python -m automotive_workbench.cli verify-evidence output/communication-chain-tampered output/evidence-manifests/communication-chain.json --base . --output output/evidence-verification-rejection
      - name: Verify controlled evidence tamper rejection
        if: ${{ always() && steps.controlled_evidence_tamper.outcome != 'skipped' }}
        run: python scripts/evidence_bundle_tamper_exercise.py check output/evidence-verification-rejection --cli-outcome ${{ steps.controlled_evidence_tamper.outcome }}
      - name: Upload evidence tamper rejection
        if: ${{ always() && steps.controlled_evidence_tamper.outcome != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: evidence-verification-rejection-${{ runner.os }}
          path: output/evidence-verification-rejection/
          if-no-files-found: error
      - name: Build communication delivery prerequisite
        env:
          PYTHONPATH: src
        run: python -m automotive_workbench.cli run-communication-delivery examples/window_control/window_control.dbc examples/window_control/bsw_intent.json --base . --output output/communication-delivery
      - name: Export evidence capsule prerequisite
        env:
          PYTHONPATH: src
        run: python -m automotive_workbench.cli export-evidence-capsule output/communication-delivery --base . --output output/evidence-capsule
      - name: Prepare controlled capsule receipt tamper
        run: python scripts/evidence_capsule_tamper_exercise.py prepare output/evidence-capsule output/evidence-capsule-tampered
      - name: Run controlled capsule tamper rejection
        id: controlled_capsule_tamper
        continue-on-error: true
        env:
          PYTHONPATH: src
        run: python -m automotive_workbench.cli verify-evidence-capsule output/evidence-capsule-tampered --output output/evidence-capsule-verification-rejection
      - name: Verify controlled capsule tamper rejection
        if: ${{ always() && steps.controlled_capsule_tamper.outcome != 'skipped' }}
        run: python scripts/evidence_capsule_tamper_exercise.py check output/evidence-capsule-verification-rejection --cli-outcome ${{ steps.controlled_capsule_tamper.outcome }}
      - name: Upload capsule tamper rejection
        if: ${{ always() && steps.controlled_capsule_tamper.outcome != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: evidence-capsule-rejection-${{ runner.os }}
          path: output/evidence-capsule-verification-rejection/
          if-no-files-found: error
      - name: Exercise unavailable SocketCAN communication backend
        id: blocked_communication_chain
        continue-on-error: true
        env:
          PYTHONPATH: src
        run: python -m automotive_workbench.cli run-communication-chain examples/window_control/window_control.dbc examples/window_control/bsw_intent.json --interface socketcan --channel workbench-definitely-missing --output output/communication-chain-blocked
      - name: Verify unavailable backend is structurally blocked
        if: ${{ always() && steps.blocked_communication_chain.outcome != 'skipped' }}
        run: python scripts/communication_backend_blocked_exercise.py output/communication-chain-blocked --cli-outcome ${{ steps.blocked_communication_chain.outcome }}
      - name: Index blocked communication evidence bundle
        if: ${{ always() && steps.blocked_communication_chain.outcome != 'skipped' }}
        env:
          PYTHONPATH: src
        run: python -m automotive_workbench.cli index-evidence output/communication-chain-blocked --producer "workbench run-communication-chain socketcan unavailable" --base . --manifest output/evidence-manifests/communication-chain-blocked.json
      - name: Verify blocked communication evidence bundle
        if: ${{ always() && steps.blocked_communication_chain.outcome != 'skipped' }}
        env:
          PYTHONPATH: src
        run: python -m automotive_workbench.cli verify-evidence output/communication-chain-blocked output/evidence-manifests/communication-chain-blocked.json --base . --output output/evidence-verification-blocked
      - name: Upload blocked communication evidence
        if: ${{ always() && steps.blocked_communication_chain.outcome != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: communication-chain-blocked-${{ runner.os }}
          path: |
            output/communication-chain-blocked/
            output/evidence-manifests/communication-chain-blocked.json
            output/evidence-verification-blocked/
          if-no-files-found: error
      - name: Prepare controlled review rejection
        run: python scripts/review_rejection_exercise.py prepare examples/review/evaluation/external-cohort-evaluation.json output/review-external-rejection-input/manifest.json
      - name: Run controlled review rejection
        id: controlled_review_rejection
        continue-on-error: true
        env:
          PYTHONPATH: src
        run: python -m automotive_workbench.cli run-review-eval output/review-external-rejection-input/manifest.json --output output/review-external-rejection
      - name: Verify controlled review rejection
        if: ${{ always() && steps.controlled_review_rejection.outcome != 'skipped' }}
        run: python scripts/review_rejection_exercise.py check output/review-external-rejection --cli-outcome ${{ steps.controlled_review_rejection.outcome }}
      - name: Upload controlled review rejection evidence
        if: ${{ always() && steps.controlled_review_rejection.outcome != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: review-external-rejection-${{ runner.os }}
          path: output/review-external-rejection/
          if-no-files-found: error

  runtime-currency:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install runtime and quality dependencies
        run: python -m pip install -e ".[diag,dev]"
      - name: Record resolved dependency inventory
        run: python scripts/write_dependency_inventory.py --output output/runtime-currency/resolved-Linux-python-3.14.json
      - name: Run Python 3.14 full regression
        env:
          PYTHONPATH: src
        run: python scripts/run_ci_tests.py --output output/runtime-currency/test-results
      - name: Validate JSON Schemas and bound examples
        run: python scripts/check_json.py
      - name: Run minimum-error Ruff gate
        run: ruff check src tests scripts
      - name: Run scoped evidence type gate
        run: mypy --ignore-missing-imports scripts/assess_model_explanation.py src/automotive_workbench/model_explanation.py src/automotive_workbench/explanation_services.py scripts/explanation_fixture_service.py scripts/run_model_explanation_scenarios.py src/automotive_workbench/project_explanation.py scripts/run_project_explanation_scenarios.py scripts/check_installed_explanation.py src/automotive_workbench/ecuc_diagnostic.py scripts/run_ecuc_diagnostic_scenarios.py src/automotive_workbench/ecuc_runtime.py scripts/run_ecuc_runtime_scenarios.py src/automotive_workbench/ecuc_policy.py src/automotive_workbench/project_ecuc.py scripts/run_ecuc_acceptance_scenarios.py src/automotive_workbench/ecuc_model.py src/automotive_workbench/ecuc_integration.py src/automotive_workbench/ecuc_review.py src/automotive_workbench/ecuc_impact.py scripts/run_ecuc_engineering_scenarios.py scripts/check_installed_ecuc.py src/automotive_workbench/ecuc_communication.py scripts/run_ecuc_communication_scenarios.py src/automotive_workbench/ecuc_project.py scripts/run_ecuc_project_scenarios.py scripts/check_installed_projects.py src/automotive_workbench/engineering_search.py scripts/run_p24_assessment.py src/automotive_workbench/engineering_review.py scripts/run_engineering_review_scenarios.py src/automotive_workbench/project_external.py scripts/run_external_project_scenarios.py src/automotive_workbench/external_ecu.py scripts/build_openbsw_execution.py scripts/run_external_ecu_scenarios.py src/automotive_workbench/project_arxml.py scripts/run_arxml_project_scenarios.py src/automotive_workbench/arxml_bridge.py scripts/replay_arxml_export.py scripts/run_arxml_scenarios.py src/automotive_workbench/communication_graph.py scripts/run_communication_graph_scenarios.py src/automotive_workbench/project_declared.py scripts/run_multi_project_scenarios.py src/automotive_workbench/declared_communication.py scripts/run_declared_communication_scenarios.py src/automotive_workbench/communication_plan.py src/automotive_workbench/adapters/generation_gate.py scripts/create_public_delivery_docx.py scripts/run_generate_arxml_bridge.py scripts/run_project_review_scenarios.py scripts/run_project_comparison_scenarios.py src/automotive_workbench/project_workflow.py src/automotive_workbench/project_review.py src/automotive_workbench/project_comparison.py src/automotive_workbench/evidence_bundle.py src/automotive_workbench/evidence_capsule.py src/automotive_workbench/evidence_capsule_verification.py scripts/check_json.py scripts/check_installed_distribution.py scripts/check_installed_capsule_consumer.py scripts/write_dependency_inventory.py
      - name: Upload Python 3.14 runtime currency evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runtime-currency-Linux-python-3.14
          path: output/runtime-currency/
          if-no-files-found: error
